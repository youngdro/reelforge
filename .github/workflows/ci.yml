name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Mesa's software Vulkan (lavapipe) and GLES, so the wgpu compositor is tested against the CPU one; ALSA headers for sound
      - name: software GPU
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libegl1 libgles2 libegl-mesa0 libasound2-dev
      - name: fmt, clippy, tests, layers, wasm
        run: cargo xtask ci
        env:
          REELFORGE_REQUIRE_GPU: "1"
      # the GL backend with WebGL2's limits: the browser preview without WebGPU
      - name: GPU compositor as on WebGL2
        run: "cargo test -p reelforge-render --features gpu gpu::"
        env:
          REELFORGE_REQUIRE_GPU: "1"
          WGPU_BACKEND: gl
          REELFORGE_GPU_LIMITS: webgl2

  # the operating system's video encoders (reelforge-hwenc), on the systems that have them
  system-encoders:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            require: "h264,hevc"
          - os: windows-latest
            require: "h264"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy -p reelforge-hwenc --all-targets -- -D warnings
      - name: encode, write an MP4, decode it
        run: cargo test -p reelforge-hwenc -- --nocapture
        env:
          REELFORGE_REQUIRE_HWENC: ${{ matrix.require }}
