name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Mesa's software Vulkan (lavapipe), so the wgpu compositor is tested against the CPU one; ALSA headers for sound
      - name: software GPU
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev
      - name: fmt, clippy, tests, layers, wasm
        run: cargo xtask ci
        env:
          REELFORGE_REQUIRE_GPU: "1"
