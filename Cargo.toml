[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/youngdro/reelforge"

[workspace.dependencies]
# internal
reelforge-time = { path = "crates/time" }
reelforge-renderspec = { path = "crates/renderspec" }
reelforge-model = { path = "crates/model" }
reelforge-compile = { path = "crates/compile" }
reelforge-render = { path = "crates/render" }
reelforge-media = { path = "crates/media" }
reelforge-hwenc = { path = "crates/hwenc" }
reelforge-engine = { path = "crates/engine" }
reelforge-ui = { path = "crates/ui" }
reelforge-server = { path = "crates/server" }

# foundation
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
log = "0.4"

# media
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# FilmCraft's clean-room, pure-Rust codecs and containers (MIT OR Apache-2.0)
filmcraft-media = "0.9"
filmcraft-codecs = "0.9"
filmcraft-time = "0.9"
filmcraft-frame = "0.9"
filmcraft-color = "0.9"
rayon = "1.12"
filmcraft-text = "0.9"
filmcraft-h264enc = "0.9"
filmcraft-aac = "0.9"
filmcraft-isobmff = "0.9"

# cli
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
ureq = "3"
base64 = "0.22"
ehttp = "0.7"
cpal = "0.18"
sys-locale = "0.3"
web-time = "1.1"

# ui (L4 and up only; `cargo xtask layers` enforces it)
egui = "0.37"
wgpu = "30"
bytemuck = "1"
pollster = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
rfd = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
