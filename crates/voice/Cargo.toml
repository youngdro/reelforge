[package]
name = "reelforge-voice"
description = "Local text to speech (Kokoro-82M, pure Rust on candle): Chinese text in, 24 kHz voice-over out."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
candle-core = "0.11.1"
candle-nn = "0.11.1"
zip = { version = "9.1.3", default-features = false }
pinyin = { version = "0.11", default-features = false, features = ["plain", "with_tone_num_end"] }
