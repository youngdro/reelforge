[package]
name = "reelforge-cli"
description = "reelforge without a window: run commands on projects, compile RenderSpecs, validate and render them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "reelforge-cli"
path = "src/main.rs"

[dependencies]
reelforge-time = { workspace = true }
reelforge-model = { workspace = true }
reelforge-renderspec = { workspace = true }
reelforge-render = { workspace = true }
reelforge-compile = { workspace = true }
reelforge-media = { workspace = true }
reelforge-hwenc = { workspace = true }
reelforge-engine = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
reelforge-server = { workspace = true }
reelforge-speech = { workspace = true }
ureq = { workspace = true }
