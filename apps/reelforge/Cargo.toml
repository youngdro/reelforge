[package]
name = "reelforge"
description = "The reelforge editor on the desktop: an eframe window drawn with wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
reelforge-ui = { workspace = true }
reelforge-engine = { workspace = true }
reelforge-model = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
