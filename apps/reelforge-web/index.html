<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reelforge</title>
  <style>html, body { margin: 0; height: 100%; background: #1b1b1b; } canvas { width: 100%; height: 100%; display: block; }</style>
</head>
<body>
  <canvas id="reelforge"></canvas>
  <script type="module">
    import init, { start } from "./reelforge_web.js";
    await init();
    // Served by a reelforge server (`reelforge-cli serve --web dist`)? Join its session; the token,
    // if it has one, comes in this page's address: http://host:7878/?token=SECRET.
    // `?server=http://host:7878` joins another one; anywhere else this is a demo project.
    const query = new URLSearchParams(location.search);
    let server = query.get("server");
    if (!server) {
      const health = await fetch("health").then(r => r.ok ? r.text() : "", () => "");
      if (health === "ok") server = location.origin;
    }
    window.reelforge = await start("reelforge", server ?? undefined, query.get("token") ?? undefined);
    // window.reelforge.execute("commands.list", "{}")
  </script>
</body>
</html>
